name: build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: "Build Chimera"
    runs-on: windows-2025

    steps:
      - name: "Configure git"
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup MSYS2 MINGW32"
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          suppress-deprecation-warnings: msystem-mingw32
          install: >-
            git
            p7zip
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            mingw-w64-i686-python

      - name: "Verify toolchain"
        shell: msys2 {0}
        run: |-
          gcc --version
          g++ --version
          cmake --version
          python --version
          test "$(gcc -dumpmachine)" = "i686-w64-mingw32"
          test "$(gcc -dumpfullversion -dumpversion)" = "16.2.0"
          test "$(g++ -dumpfullversion -dumpversion)" = "16.2.0"

      - name: "Compile"
        shell: msys2 {0}
        run: |-
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --parallel

      - name: "Strip symbols"
        if: "startsWith(github.ref, 'refs/tags/')"
        shell: msys2 {0}
        run: |-
          strip ./build/strings.dll

      - name: "Package"
        id: package
        shell: msys2 {0}
        run: |-
          SHA="${GITHUB_SHA:0:8}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            PACKAGE_NAME="chimera-${VERSION}.7z"
          else
            VERSION=""
            PACKAGE_NAME="chimera-${SHA}.7z"
          fi

          mkdir -p package
          cp ./build/strings.dll package/strings.dll
          cp ./chimera.ini package/chimera.ini

          cd package
          7z a -mx=9 "../${PACKAGE_NAME}" strings.dll chimera.ini
          cd ..

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "SHA=${SHA}" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: "Upload artifact"
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: chimera-${{ steps.package.outputs.SHA }}
          path: ./${{ steps.package.outputs.PACKAGE_NAME }}

      - name: "Create draft release"
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.VERSION }}
          name: Chimera Hardened v${{ steps.package.outputs.VERSION }}
          draft: true
          prerelease: false
          files: ./${{ steps.package.outputs.PACKAGE_NAME }}
